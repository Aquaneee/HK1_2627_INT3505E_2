openapi: 3.0.3
info:
  title: User API (v1 & v2)
  version: 2.0.0
servers:
  - url: http://localhost:5000
paths:
  /api/v1/users/{id}:
    get:
      summary: Lấy thông tin user (v1 - Deprecated)
      deprecated: true
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Thành công (kèm header Sunset)
          headers:
            Sunset:
              schema:
                type: string
              description: Thời điểm API v1 ngừng hoạt động
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserV1"
        "404":
          description: Không tìm thấy user

  /api/v2/users/{id}:
    get:
      summary: Lấy thông tin user (v2)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserV2"
        "404":
          description: Không tìm thấy user

  /api/v2/users:
    post:
      summary: Tạo mới user (v2)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserV2Input"
      responses:
        "201":
          description: Tạo thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserV2"
        "400":
          description: Dữ liệu đầu vào không hợp lệ

components:
  schemas:
    UserV1:
      type: object
      properties:
        id:
          type: integer
        full_name:
          type: string
        email:
          type: string
    UserV2:
      type: object
      properties:
        id:
          type: integer
        first_name:
          type: string
        last_name:
          type: string
        email:
          type: string
    UserV2Input:
      type: object
      required: [first_name, last_name, email]
      properties:
        first_name:
          type: string
        last_name:
          type: string
        email:
          type: string