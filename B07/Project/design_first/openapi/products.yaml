openapi: 3.0.3
info:
  title: Product API
  version: 1.0.0
paths:
  /products:
    get:
      operationId: api.products.list_products
      responses:
        '200':
          description: OK
    post:
      operationId: api.products.create_product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductIn'
      responses:
        '201':
          description: Created
        '422':
          description: Validation Error
  /products/{id}:
    get:
      operationId: api.products.get_product
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK
        '404':
          description: Not Found

components:
  schemas:
    ProductIn:
      type: object
      properties:
        name:
          type: string
        price:
          type: number
      required:
        - price